# Redirecturi permanente (301) de la adresele vechiului site.
# Se include în blocul `server { ... }` al rotaryclubcaransebes.ro:
#   include /calea/proiectului/deploy/nginx-redirects.conf;
# apoi: sudo nginx -t && sudo systemctl reload nginx
# Aceeași listă este în redirects.mjs (acolo generează pagini de rezervă cu redirect).
location ~ ^/rotary-caransebes/?$                { return 301 /despre-noi/; }
location ~ ^/presedinti/?$                       { return 301 /despre-noi/fosti-presedinti/; }
location ~ ^/membrii/?$                          { return 301 /despre-noi/membri-activi/; }
location ~ ^/de-ce-in-rotary/fundatia-rotary/?$  { return 301 /fundatia-rotary/; }
location ~ ^/de-ce-in-rotary/contact-us/?$       { return 301 /contact/; }
location ~ ^/de-ce-in-rotary/?$                  { return 301 /membership/de-ce-in-rotary/; }
location ~ ^/admitere-in-club/?$                 { return 301 /membership/admitere-in-club/; }
location ~ ^/testul-celor-4-cai/?$               { return 301 /membership/testul-celor-4-cai/; }
location ~ ^/codul-de-conduita/?$                { return 301 /membership/codul-de-conduita/; }
location ~ ^/category/proiecte/?$                { return 301 /proiecte/; }
location ~ ^/realizari/?$                        { return 301 /proiecte/realizari/; }
location ~ ^/category/actiuni/?$                 { return 301 /proiecte/actiuni/; }
